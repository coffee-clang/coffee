[book]
title = "Coffee"
description = "A modern package manager for C"
authors = ["Gianluca Della Vedova"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
no-section-label = true
default-theme = "light"
preferred-dark-theme = "light"
# Search is enabled — see the search toggle in the menu-bar
theme = "docs/theme"
additional-css = ["docs/theme/coffee.css"]

[output.html.playground]
editable = false
runnable = false
line-numbers = false

# The CSS @import-remote approach means fonts, logo, and brand styles
# are pulled live from coffee-clang.github.io at page-load time.
# For offline builds, run: scripts/fetch-docs-assets.sh