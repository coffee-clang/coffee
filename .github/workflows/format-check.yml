name: Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tools
        run: |
          sudo apt-get update && \
          sudo apt-get install -y clang-format clang-tidy

      - name: Stash uncommitted changes
        run: git stash

      - name: Run clang-format
        run: make format

      - name: Run clang-tidy
        run: make tidy

      - name: Check for changes
        run: |
          if ! git diff --quiet; then
            echo "Files need formatting or have tidy issues:"
            git diff --name-only
            git diff
            exit 1
          fi

      - name: Restore uncommitted changes
        if: always()
        run: git stash pop
